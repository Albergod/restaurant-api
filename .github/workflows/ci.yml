name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kaydo
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: restaurant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaydo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kaydo:testpass123@localhost:5432/restaurant_test
      ALLOW_PUBLIC_STAFF_REGISTRATION: "false"
      SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt -r requirements-test.txt
      - name: Tests backend
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint (informativo: hay deuda pre-existente)
        continue-on-error: true
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kaydo
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: restaurant_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaydo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DB_URL: postgresql+asyncpg://kaydo:testpass123@localhost:5432/restaurant_e2e
      E2E_ALLOW_REGISTRATION: "false"
      E2E_PYTHON: python
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar backend
        working-directory: .
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar frontend + Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Tests E2E
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
