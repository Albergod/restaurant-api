[pytest]
asyncio_mode = auto
# Un solo loop por sesión: los fixtures async (app/cliente/DB) se comparten
# entre tests sin errores de "attached to a different loop".
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short
